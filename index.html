<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050814">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<meta name="description" content="Project Zero Open Alpha web game">
<title>Project Zero Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?build=2026091302-mobile-ailo-portrait-tuning">
</head>
<body>
<section id="installGate" class="install-gate" hidden>
  <div class="install-shell">
    <img src="assets/ui/project_zero_logo.png?build=2026091302-mobile-ailo-portrait-tuning" alt="Project Zero">
    <div class="install-kicker">PROJECT ZERO / MOBILE CLIENT</div>
    <h1>请先添加到主屏幕</h1>
    <p id="installLead">手机版不会在普通浏览器中直接启动。添加到主屏幕后，从桌面图标进入即可使用横屏、全屏和触控功能。</p>
    <div class="install-steps" id="installSteps"></div>
    <button id="installAppButton" type="button">添加到主屏幕</button>
    <p class="install-note">安装后请关闭此浏览器页面，并点击主屏幕上的 PZ Mobile 图标。</p>
  </div>
</section>
<div id="bootScreen" role="status" aria-live="polite">
  <img src="assets/ui/project_zero_logo.png?build=2026091302-mobile-ailo-portrait-tuning" alt="Project Zero">
  <div class="boot-spinner"></div>
  <div id="bootStatus">LOADING PROJECT ZERO</div>
  <div id="bootVersion"></div>
  <div id="bootDetail"></div>
  <div id="bootActions" class="boot-actions hidden">
    <button id="bootRetry" type="button">重新加载 / RETRY</button>
    <button id="bootReset" type="button">清除旧缓存 / RESET CACHE</button>
  </div>
</div>
<div id="gameWrap"><canvas id="game" width="1120" height="660"></canvas></div>
<script src="account-config.js?build=2026091302-mobile-ailo-portrait-tuning"></script>
<script src="pz-account-api.js?build=2026091302-mobile-ailo-portrait-tuning"></script>
<script src="update-client.js?build=2026091302-mobile-ailo-portrait-tuning"></script>
</body>
</html>
